<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Dispositivos</title>
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <script src="https://kit.fontawesome.com/3f21966000.js" crossorigin="anonymous"></script>
    <style>
        .device-management-page {
            max-width: 980px;
            margin: 30px auto 60px;
            padding: 0 20px;
        }

        .device-management-panel {
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(11,28,40,0.2));
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 24px 20px 18px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.18);
        }

        .device-management-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 22px;
        }

        .device-management-header h2 {
            margin: 0;
            color: var(--branco);
            font-size: clamp(1.5rem, 2vw, 2rem);
        }

        .device-form {
            margin-bottom: 24px;
        }

        .device-form label {
            display: block;
            margin-bottom: 8px;
            color: var(--texto);
            font-weight: 600;
        }

        .device-form-row {
            display: flex;
            gap: 12px;
        }

        .device-form-row input {
            flex: 1;
            min-width: 0;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06);
            color: var(--texto);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 1rem;
        }

        .device-form-row input::placeholder {
            color: rgba(234,246,255,0.7);
        }

        .primary-btn {
            background: linear-gradient(135deg, #7ac3ea 0%, #3f88b8 100%);
            color: var(--branco);
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-weight: 700;
            cursor: pointer;
        }

        .device-list-wrapper {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 18px 16px;
        }

        .device-list-wrapper h3 {
            margin: 0 0 16px;
            color: var(--branco);
            font-size: 1.2rem;
        }

        .device-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .device-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            color: var(--texto);
        }

        .device-name {
            font-size: 1rem;
            word-break: break-word;
        }

        .remove-device-btn {
            background: #df5a5a;
            color: var(--branco);
            border: none;
            border-radius: 10px;
            padding: 9px 12px;
            cursor: pointer;
            font-weight: 700;
        }

        .device-empty {
            color: rgba(234,246,255,0.8);
            text-align: center;
            padding: 18px 0;
        }

        @media (max-width: 640px) {
            .device-management-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .device-form-row {
                flex-direction: column;
            }

            .device-item {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <h2 id="mensagem"></h2>
    <header class="cabecalho">
        <div class="cabecalho-topo">
            <button class="lampada-toggle" type="button" aria-label="Alternar modo escuro" title="Ativar modo escuro">
                <img class="lampada" src="imagens/icone lapda.png" alt="icone de lampada">
            </button>
            <div class="cabecalho-direita">
                <h1>Dashboard</h1>
                <div class="bars-icon">
                    <i class="fa-solid fa-bars"></i>
                    <ul class="menu" id="icone-menu">
                        <li><a href="dashboard.html">Início</a></li>
                        <li><a href="gerenciar_dispositivos.html">Gerenciar dispositivos</a></li>
                        <li><a href="index.html">Voltar ao login</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <main class="device-management-page">
        <section class="device-management-panel">
            <div class="device-management-header">
                <h2>Gerenciar dispositivos</h2>
                <a href="dashboard.html" class="back-link">← Voltar</a>
            </div>

            <form id="deviceForm" class="device-form">
                <label for="novoDispositivo">Adicionar dispositivo</label>
                <div class="device-form-row">
                    <input id="novoDispositivo" type="text" maxlength="80" placeholder="Ex.: Lâmpada inteligente" required>
                    <button type="submit" class="primary-btn">Adicionar</button>
                </div>
            </form>

            <div class="device-list-wrapper">
                <h3>Dispositivos cadastrados</h3>
                <ul id="deviceList" class="device-list"></ul>
            </div>
        </section>
    </main>

    <script>
        const DEVICE_STORAGE_KEY = 'smartcontrol-device-list';
        const DEFAULT_DEVICES = [
            'Smart TV Samsung',
            'Robô aspirador de pó',
            'Ar condicionado Electrolux',
            'Persiana elétrica motorizada',
            'Lâmpada smart inteligente',
            'Interruptor inteligente',
            'Controle remoto inteligente',
            'Poltrona elétrica reclinável'
        ];

        function getDevices() {
            const stored = localStorage.getItem(DEVICE_STORAGE_KEY);

            if (!stored) {
                localStorage.setItem(DEVICE_STORAGE_KEY, JSON.stringify(DEFAULT_DEVICES));
                return [...DEFAULT_DEVICES];
            }

            try {
                const parsed = JSON.parse(stored);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    return parsed.filter(Boolean).map(item => String(item).trim());
                }
            } catch (error) {
                console.warn('Lista de dispositivos inválida. Recriando padrão.', error);
            }

            localStorage.setItem(DEVICE_STORAGE_KEY, JSON.stringify(DEFAULT_DEVICES));
            return [...DEFAULT_DEVICES];
        }

        function saveDevices(devices) {
            const sanitized = devices
                .map(item => String(item).trim())
                .filter(Boolean)
                .filter((item, index, list) => list.findIndex(entry => entry.toLowerCase() === item.toLowerCase()) === index);

            localStorage.setItem(DEVICE_STORAGE_KEY, JSON.stringify(sanitized));
            return sanitized;
        }

        function renderDevices() {
            const list = document.getElementById('deviceList');
            if (!list) return;

            const devices = getDevices();
            list.innerHTML = '';

            if (!devices.length) {
                const emptyItem = document.createElement('li');
                emptyItem.className = 'device-empty';
                emptyItem.textContent = 'Nenhum dispositivo cadastrado.';
                list.appendChild(emptyItem);
                return;
            }

            devices.forEach(device => {
                const item = document.createElement('li');
                item.className = 'device-item';

                const name = document.createElement('span');
                name.className = 'device-name';
                name.textContent = device;

                const removeButton = document.createElement('button');
                removeButton.type = 'button';
                removeButton.className = 'remove-device-btn';
                removeButton.textContent = 'Remover';
                removeButton.dataset.device = device;

                item.appendChild(name);
                item.appendChild(removeButton);
                list.appendChild(item);
            });
        }

        function addDevice(name) {
            const value = String(name || '').replace(/\s+/g, ' ').trim();
            if (!value) return false;

            const devices = getDevices();
            const alreadyExists = devices.some(item => item.toLowerCase() === value.toLowerCase());
            if (alreadyExists) return false;

            const updated = saveDevices([...devices, value]);
            if (typeof window.refreshRoomDeviceList === 'function') {
                window.refreshRoomDeviceList(updated);
            }
            renderDevices();
            return true;
        }

        function removeDevice(name) {
            const normalized = String(name || '').trim();
            if (!normalized) return;

            const updated = saveDevices(getDevices().filter(item => item.toLowerCase() !== normalized.toLowerCase()));
            if (typeof window.refreshRoomDeviceList === 'function') {
                window.refreshRoomDeviceList(updated);
            }
            renderDevices();
        }

        const form = document.getElementById('deviceForm');
        const input = document.getElementById('novoDispositivo');

        form.addEventListener('submit', event => {
            event.preventDefault();
            const value = input.value.trim();

            if (!value) {
                input.focus();
                return;
            }

            const added = addDevice(value);
            if (!added) {
                input.setCustomValidity('Este dispositivo já existe.');
                input.reportValidity();
                return;
            }

            input.setCustomValidity('');
            input.value = '';
            input.focus();
        });

        document.getElementById('deviceList').addEventListener('click', event => {
            const button = event.target.closest('.remove-device-btn');
            if (!button) return;
            removeDevice(button.dataset.device);
        });

        renderDevices();
        
    </script>
</body>
</html>
