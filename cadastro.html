<html lang="en">
<head>

<form action="index.html" method="get"></form>
    <label for="nome">Nome completo</label><br>
        <input type="text" id="nome" name="Nome completo" placeholder="Enter" required> <br> 
    <label for="nome">Email</label><br> 
        <input type="text" id="email" name="Email" placeholder="Enter" required> <br>
    <label for="senha">Senha de Acesso</label><br> 
        <input type="password" id="senha" name="Senha de Acesso" minlength="8" placeholder="Enter" required><br>
    <label for="nivel-acesso">Nível de acesso</label><br>
    <select id="nivel-acesso" name="Nível" required>
        <option value="" hidden>Selecione uma opção</option>
        <option value="Gerente">Gerente</option>
        <option value="Administrador">Administrador</option>
    </select><br>
    <label for="termos">Aceito os termos de uso</label><br>
    <input type="checkbox" id="termos" required><br>
    <input type="submit" value="Entrar"><br>
</form>
