<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faça seu Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<body>
    <header id="cabecalho">
        <img id="lampada" src="imagens/icone lapda.png" alt="Imagem de uma lâmpada">
        <h1>Faça seu Login</h1>
        <img id="menu" src="imagens/icone de aburgui.png" alt="Menu">
    </header>
    <div id="form">
        <form method="get" action="dashboard.html" id="formulario">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu E-mail..." required>
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha..." required minlength="8">
            <button type="submit">Login</button>
        </form>
        <a href="cadastro.html"><h3>Criar conta</h3></a>
        <a href="esqueci_senha.html"><h3>Esqueci minha senha</h3></a>
    </div>

</body>
</html>
