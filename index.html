<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faça seu Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://kit.fontawesome.com/3f21966000.js" crossorigin="anonymous"></script>
</head>
<body>
    <header id="cabecalho">
        <div class="cabecalho-topo">
            <button class="lampada-toggle" type="button" aria-label="Alternar modo escuro" title="Ativar modo escuro">
                <img id="lampada" src="imagens/icone lapda.png" alt="Imagem de uma lâmpada">
            </button>
            <div class="cabecalho-direita">
                <h1>Faça seu Login</h1>
                <div class="bars-icon">
                    <i class="fa-solid fa-bars"></i>
                    <ul class="menu">
                        <li><a href="index.html">Login</a></li>
                        <li><a href="cadastro.html">Cadastro</a></li>
                        <li><a href="redefinir_senha.html">Redefinir senha</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>
    <div id="form">
        <form method="get" action="dashboard.html" id="formulario">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu E-mail..." required>
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha..." required minlength="8">
            <button type="submit">Login</button>
        </form>
        <a href="cadastro.html"><h3>Criar conta</h3></a>
        <a href="redefinir_senha.html"><h3>Esqueci minha senha</h3></a>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
